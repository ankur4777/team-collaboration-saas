name: Checks
on:
  push:
  pull_request:
jobs:
  python-checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: teamworkspace
          MYSQL_USER: teamworkspace
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-root-password --silent"
          --health-interval=8s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: pip install -r requirements.txt
      - run: python -m compileall -q config workspace mailbox_app
      - run: python manage.py makemigrations --check --dry-run
        env: &env
          DJANGO_DEBUG: 'true'
          DJANGO_SECRET_KEY: 'test-only-not-a-production-secret'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: teamworkspace
          # CI only: test runner needs CREATE DATABASE for test_teamworkspace.
          # Production and docker-compose continue using the restricted app user.
          MYSQL_USER: root
          MYSQL_PASSWORD: test-root-password
          REDIS_URL: redis://127.0.0.1:6379/0
      - run: 'python -c "from config.asgi import application; from workspace.routing import websocket_urlpatterns; assert len(websocket_urlpatterns) == 3"'
        env: *env
      - run: python manage.py test workspace mailbox_app --verbosity 2
        env: *env
  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run test:mail
      - run: npm run build

  mail-setup-helper:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "python-dotenv>=1.0,<2"
      - run: python -m unittest discover -s tools/tests -v
      - name: Validate PowerShell setup script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/setup-mail.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Check setup wrapper orchestration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/tests/check_setup_wrapper.ps1

