name: Checks
on:
  push:
  pull_request:
jobs:
  python-checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: teamworkspace
          MYSQL_USER: teamworkspace
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-root-password --silent"
          --health-interval=8s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: pip install -r requirements.txt
      - run: python -m compileall -q config workspace
      - run: python manage.py makemigrations --check --dry-run
        env: &env
          DJANGO_DEBUG: 'true'
          DJANGO_SECRET_KEY: 'test-only-not-a-production-secret'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: teamworkspace
          # CI only: test runner needs CREATE DATABASE for test_teamworkspace.
          # Production and docker-compose continue using the restricted app user.
          MYSQL_USER: root
          MYSQL_PASSWORD: test-root-password
          REDIS_URL: redis://127.0.0.1:6379/0
      - run: 'python -c "from config.asgi import application; from workspace.routing import websocket_urlpatterns; assert len(websocket_urlpatterns) == 3"'
        env: *env
      - run: python manage.py test workspace --verbosity 2
        env: *env
  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
