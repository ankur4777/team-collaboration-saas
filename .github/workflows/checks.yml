name: Checks
on:
  push:
  pull_request:
jobs:
  python-checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: teamworkspace
          MYSQL_USER: teamworkspace
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptest-root-password --silent"
          --health-interval=8s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: pip install -r requirements.txt
      - run: python -m compileall -q config workspace mailbox_app
      - run: python manage.py makemigrations --check --dry-run
        env: &env
          DJANGO_DEBUG: 'true'
          DJANGO_SECRET_KEY: 'test-only-not-a-production-secret'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: teamworkspace
          # CI only: test runner needs CREATE DATABASE for test_teamworkspace.
          # Production and docker-compose continue using the restricted app user.
          MYSQL_USER: root
          MYSQL_PASSWORD: test-root-password
          REDIS_URL: redis://127.0.0.1:6379/0
      - run: 'python -c "from config.asgi import application; from workspace.routing import websocket_urlpatterns; assert len(websocket_urlpatterns) == 4"'
        env: *env
      - run: python manage.py test workspace mailbox_app --verbosity 2
        env: *env
  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run test:mail
      - run: npm run build

  mail-setup-helper:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "python-dotenv>=1.0,<2"
      - run: python -m unittest discover -s tools/tests -v
      - name: Validate PowerShell setup script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/setup-mail.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Check setup wrapper orchestration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/tests/check_setup_wrapper.ps1



  native-call-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      API_PROXY_TARGET: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Prepare Chromium
        working-directory: frontend
        run: |
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            echo "CALL_TEST_CHROMIUM=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: python manage.py migrate --noinput
        working-directory: backend
      - run: python tools/seed_native_call_test.py
      - name: Run API and frontend
        run: |
          (cd backend && daphne -b 127.0.0.1 -p 8000 config.asgi:application > /tmp/native-api.log 2>&1) &
          (cd frontend && npx vite --host 127.0.0.1 --port 5173 > /tmp/native-web.log 2>&1) &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/api/health/; then exit 0; fi
            sleep 1
          done
          cat /tmp/native-api.log /tmp/native-web.log
          exit 1
      - run: node e2e/native-call.mjs
        working-directory: frontend
      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/native-api.log /tmp/native-web.log || true

      - name: Upload call UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-call-ui
          path: frontend/call-test-results/
          if-no-files-found: ignore
